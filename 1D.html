<style>
:root {
  --primary:#1e3a5f; --primary2:#2b6cb0; --accent:#3182ce;
  --ok:#38a169; --okbg:#f0fff4; --bad:#e53e3e; --badbg:#fff5f5;
  --bg:#f0f4f8; --card:#fff; --border:#e2e8f0; --muted:#718096;
  --sidebar-w:200px; --topbar-h:36px;
  --radius:10px; --shadow:0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--bg);color:#1a202c;line-height:1.55;-webkit-text-size-adjust:100%}
body{
  display:grid;
  grid-template-columns:var(--sidebar-w) minmax(0,1fr);
  grid-template-rows:var(--topbar-h) minmax(0,1fr);
  grid-template-areas:"side top" "side main";
  overflow:hidden;min-height:100dvh;min-height:100vh;
}
.topbar{grid-area:top;background:linear-gradient(135deg,#1e3a5f,#2b6cb0);color:#fff;display:flex;align-items:center;gap:.45rem;padding:0 .65rem;z-index:100;height:var(--topbar-h);min-height:var(--topbar-h);box-shadow:0 1px 4px rgba(0,0,0,.12);min-width:0}
.topbar h1{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;margin:0}
.btn-report{background:#ed8936;color:#1a202c;border:none;padding:.28rem .55rem;border-radius:6px;font-weight:700;font-size:.72rem;cursor:pointer;white-space:nowrap}
.btn-report:hover{background:#dd6b20}
.btn-menu{display:none;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:8px;font-size:1.2rem;cursor:pointer}
.sidebar{grid-area:side;background:#1a365d;color:#fff;overflow-y:auto;padding:.6rem 0;-webkit-overflow-scrolling:touch;min-height:0}
.sidebar .brand{padding:0 .85rem .5rem;font-size:.75rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:.35rem;line-height:1.25}
.sidebar .sec-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:#90cdf4;padding:.55rem 1rem .2rem;font-weight:600}
.sidebar a{display:flex;align-items:center;gap:.4rem;color:#bee3f8;text-decoration:none;padding:.38rem .85rem;font-size:.8rem;font-weight:500;border-left:3px solid transparent;transition:all .15s;cursor:pointer}
.sidebar a:hover,.sidebar a.active {background:rgba(49,130,206,.25);color:#fff;border-left-color:#63b3ed}
.sidebar a .n{width:22px;height:22px;border-radius:6px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.sidebar a.active .n{background:#3182ce}
.side-student{padding:.5rem .85rem .65rem;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:.35rem}
.side-student label{display:block;font-size:.68rem;color:#90cdf4;margin-bottom:.25rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.side-student input{width:100%;padding:.35rem .5rem;border:none;border-radius:6px;font-size:#82rem;margin-bottom:.4rem;background:#fff;color:#1a202c}
.side-student .btn-report{width:100%;padding:.4rem .5rem;border-radius:6px;font-size:.75rem;margin:0}
.save-ind{font-size:.68rem;color:#9ae6b4;opacity:0;transition:opacity .3s;text-align:center;margin-top:.2rem}
.save-ind.show{opacity:1}
.main-page-link{display:flex;align-items:center;gap:.35rem;color:#90cdf4;text-decoration:none;padding:.35rem .85rem .5rem;font-size:.78rem;font-weight:600;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:.25rem}
.main-page-link:hover{color:#fff}
.progress-wrap{padding:.45rem .85rem .35rem}
.progress-label{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;color:#90cdf4;font-weight:600;margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.04em}
.progress-bar{height:8px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#38a169,#68d391);border-radius:99px;transition:width .35s ease}
.progress-pct{font-variant-numeric:tabular-nums;color:#9ae6b4}
.btn-clear-all{width:100%;margin-top:.35rem;background:#718096;color:#fff;border:none;padding:.35rem .5rem;border-radius:6px;font-size:.75rem;font-weight:600;cursor:pointer}
.btn-clear-all:hover{background:#4a5568}
.main{grid-area:main;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:.55rem .7rem 1.2rem;min-width:0;min-height:0}
section{display:none;background:var(--card);border-radius:var(--radius);padding:.85rem 1rem;box-shadow:var(--shadow);border:1px solid var(--border);max-width:820px;margin:0 auto}
section.active{display:block}
h2{color:var(--primary);font-size:1.05rem;font-weight:700;margin-bottom:.45rem;padding-bottom:.3rem;border-bottom:2px solid var(--accent)}
h3{color:var(--primary2);font-size:1rem;margin:1.1rem 0 .5rem}
h4{color:var(--primary);margin:.5rem 0 .3rem;font-size:.92rem}
.page-tag{display:inline-block;background:#ebf8ff;color:var(--accent);font-size:.7rem;font-weight:700;padding:.15rem .55rem;border-radius:20px;margin-bottom:.6rem}
.exercise{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:.65rem .8rem;margin:.55rem 0}
.exercise-num{font-weight:700;color:var(--primary);margin-bottom:.45rem;font-size:.92rem}
p,li{margin-bottom:.35rem;font-size:.92rem}
ul,ol{padding-left:1.2rem;margin-bottom:.5rem}
.article{background:#f0f7ff;border-left:4px solid var(--accent);padding:.85rem 1rem;margin:.7rem 0;border-radius:0 10px 10px 0;font-size:.88rem}
.green-box{background:#f0fff4;border:1px solid #c6f6d5;border-radius:10px;padding:.75rem 1rem;margin:.6rem 0;font-size:.9rem}
.blue-box{background:#ebf8ff;border:1px solid #bee3f8;border-radius:10px;padding:.75rem 1rem;margin:.6rem 0}
.orange-box{background:#fffaf0;border:1px solid #feebc8;border-radius:10px;padding:.75rem 1rem;margin:.6rem 0}
.note{font-size:.82rem;color:#744210;background:#fffff0;border-left:3px solid #d69e2e;padding:.4rem .7rem;margin:.55rem 0;border-radius:0 8px 8px 0}
.tip{background:#faf5ff;border:1px solid #e9d8fd;border-radius:10px;padding:.7rem .9rem;margin:.6rem 0;font-size:.86rem}
.meta{font-size:.82rem;color:var(--muted);margin-bottom:.5rem}
input[type=text],select,textarea{font-family:inherit;font-size:.9rem;padding:.4rem .6rem;border:2px solid #cbd5e0;border-radius:8px;width:100%;max-width:260px;background:#fff;transition:border-color .12s,box-shadow .12s}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(49,130,206,.15)}
input.live-ok,select.live-ok{border-color:var(--ok)!important;background:var(--okbg)!important}
input.live-bad,select.live-bad{border-color:var(--bad)!important;background:var(--badbg)!important}
input.correct,select.correct{border-color:var(--ok)!important;background:var(--okbg)!important}
input.wrong,select.wrong{border-color:var(--bad)!important;background:var(--badbg)!important}
.blank{display:inline-block;width:140px;margin:0 .15rem}
textarea{max-width:100%;min-height:64px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:.25rem;background:var(--accent);color:#fff;border:none;padding:.42rem .9rem;border-radius:8px;font-size:.84rem;font-weight:600;cursor:pointer;margin:.3rem .25rem .3rem 0;transition:background 0.15s;}
.btn:hover{background:var(--primary2)}
</style>
</head>
