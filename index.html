<!-- REPLACE YOUR EXISTING MODAL BUTTONS WITH THIS -->
<div class="modal-buttons" style="display: flex; gap: 10px; margin-top: 15px;">
    <button id="sendSheetBtn" onclick="sendModalReportToSheet()" style="background: #238636; color: white; padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
        🚀 Send to Teacher
    </button>
    <button onclick="copyReport()" style="padding: 10px 16px;">📋 Copy</button>
    <button onclick="downloadReport()" style="padding: 10px 16px;">⬇️ Download</button>
    <button onclick="closeModal()" style="padding: 10px 16px;">Close</button>
</div>

<p id="sendModalStatus" style="margin-top: 10px; font-weight: bold;"></p>

<script>
async function sendModalReportToSheet() {
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyOLbbrIaq7jq7Y9sBQYBbeLUTjZYwdb00ICZFYuryqlIwdijKO96bzpCqVWwNJdV9SKw/exec";
    
    const btn = document.getElementById("sendSheetBtn");
    const status = document.getElementById("sendModalStatus");
    
    // Grab text report content from the textarea/modal box
    const reportText = document.querySelector('.modal-body, textarea, pre')?.innerText || document.querySelector('.modal-body, textarea, pre')?.value || "";
    
    // Extract student name from sidebar or report text
    const studentMatch = reportText.match(/Student:\s*(.+)/i);
    const studentName = studentMatch ? studentMatch[1].trim() : "Nino";

    btn.disabled = true;
    status.textContent = "Sending to teacher's Google Sheet...";
    status.style.color = "#0969da";

    try {
        await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                studentName: studentName,
                course: "Speakout-B2",
                lesson: "1A My ID",
                reportDetails: reportText
            })
        });

        status.textContent = "✅ Successfully sent to Google Sheet!";
        status.style.color = "#1a7f37";
        btn.textContent = "Sent!";
    } catch (err) {
        status.textContent = "❌ Failed to send. Please check your connection.";
        status.style.color = "#cf222e";
        btn.disabled = false;
    }
}
</script>
